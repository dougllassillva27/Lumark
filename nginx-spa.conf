server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA não tem rotas de servidor; fallback garante deep-link
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets com hash de versionamento: cache longo
    location /assets/ {
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
}
